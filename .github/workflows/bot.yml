
name: Run Flipkart Bot

on:
  schedule:
    - cron: '*/10 * * * *' # Har 10 minute mein automatic run hoga
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '154.0.8037.0'

      - name: Install dependencies directly
        run: |
          python -m pip install --upgrade pip
          pip install requests undetected-chromedriver selenium

      - name: Run bot with live unbuffered logs
        run: python3 -u flipkart_bot.py
